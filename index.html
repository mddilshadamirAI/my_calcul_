<body>

<div class="calc-card">

    <div class="header-section">
        <div class="brand-wrap">
            <img src="my_logo.png" alt="Logo" class="logo">

            <div class="brand-title">
                <h2 id="calc-title">Dilshad's Calc Pro</h2>
                <span class="brand-subtitle">Smart Calculator</span>
            </div>
        </div>

        <span class="status-dot"></span>
    </div>

    <div class="action-row">
        <button class="btn-toggle-sci" onclick="toggleScientificPanel()">🔬 Mode</button>
        <button class="btn-toggle-hist" onclick="toggleHistoryPanel()">📜 History</button>
        <button class="btn-toggle-tools" onclick="toggleToolsPanel()">📐 Tools</button>
        <button class="btn-revise" onclick="reviseCalculation()">🔊 Revise</button>
    </div>

    <div class="display-container">
        <div id="display" class="calc-display">0</div>
    </div>

    <!-- HISTORY -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span>Previous Logs · Max 100</span>
            <button class="clear-hist-btn" onclick="clearHistory()">Clear All</button>
        </div>

        <div class="history-list" id="historyList"></div>
    </div>

    <!-- TOOLS -->
    <div class="tools-panel" id="toolsPanel">

        <select class="tool-selector" id="toolTypeSelect" onchange="switchToolSegment()">
            <option value="age">🎂 Exact Age Calculator</option>
            <option value="bmi">⚖️ BMI Calculator</option>
            <option value="distance">📏 Distance Converter</option>
            <option value="area">🗺️ Area Converter</option>
            <option value="data">💾 Data Storage Converter</option>
            <option value="date">📅 Date Difference</option>
            <option value="discount">🏷️ Discount Calculator</option>
            <option value="mass">🏋️ Mass / Weight Converter</option>
            <option value="speed">🚀 Speed Converter</option>
            <option value="temp">🌡️ Temperature Converter</option>
            <option value="time">⏱️ Time Converter</option>
            <option value="volume">🧪 Volume Converter</option>
        </select>

        <div class="tool-body" id="toolBody"></div>
    </div>

    <!-- SCIENTIFIC -->
    <div class="scientific-panel" id="scientificPanel">

        <button class="btn-sci" onclick="appendScientific('sin(')">sin</button>
        <button class="btn-sci" onclick="appendScientific('cos(')">cos</button>
        <button class="btn-sci" onclick="appendScientific('tan(')">tan</button>
        <button class="btn-sci" onclick="appendScientific('sqrt(')">√</button>

        <button class="btn-sci" onclick="appendScientific('log(')">log</button>
        <button class="btn-sci" onclick="appendScientific('ln(')">ln</button>
        <button class="btn-sci" onclick="appendScientific('^')">aˣ</button>
        <button class="btn-sci" onclick="appendScientific('fact(')">x!</button>

        <button class="btn-sci" onclick="appendScientific('e^(')">eˣ</button>
        <button class="btn-sci" onclick="appendScientific('1/(')">inv</button>
        <button class="btn-sci" onclick="appendScientific('π')">π</button>
        <button class="btn-sci" onclick="appendScientific('e')">e</button>

        <button class="btn-sci" onclick="appendScientific('(')">(</button>
        <button class="btn-sci" onclick="appendScientific(')')">)</button>
        <button class="btn-sci" onclick="appendScientific(',')">,</button>
    </div>

    <!-- MAIN CALCULATOR -->
    <div class="buttons">

        <button class="btn-action" onclick="clearDisplay()">C</button>
        <button class="btn-action" onclick="deleteLast()">DEL</button>
        <button class="btn-action" onclick="appendOperator('%')">%</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button onclick="appendNumber('0')">0</button>

            <h3>🔒 Private Vault</h3>
            <button class="close-vault-btn" onclick="closeVault()">Lock</button>
        </div>

            📁 Upload to Hide Media
            <input
                type="file"
                id="vaultInput"
                accept="image/*,video/*"
                multiple
                style="display:none"
                onchange="handleFileSelect(event)"
            >
        </label>

        <div id="galleryGrid" class="gallery-grid"></div>

    </div>
</div>

<script>
let display = document.getElementById("display");
let calcTitle = document.getElementById("calc-title");

let clearOnNextInput = false;
let lastActiveFormula = "";
let finalCalculationResult = "";

let historyLog = JSON.parse(localStorage.getItem("calcHistory")) || [];
let vaultCode = localStorage.getItem("vaultCode") || null;
let equalClickCount = 0;

/* Scientific functions */

const sin = deg => Math.sin(deg * Math.PI / 180);
const cos = deg => Math.cos(deg * Math.PI / 180);
const tan = deg => Math.tan(deg * Math.PI / 180);
const log = x => Math.log10(x);
const ln = x => Math.log(x);
const sqrt = x => Math.sqrt(x);

const fact = n => {
    if (n < 0 || !Number.isInteger(n)) return NaN;
    if (n === 0 || n === 1) return 1;

    let r = 1;

    for (let i = 2; i <= n; i++) {
        r *= i;
    }

    return r;
};

if (!vaultCode) {
    calcTitle.innerText = "Set Passcode & Press =";
}

renderHistory();
switchToolSegment();

/* Display */

function updateDisplayValue(value) {
    display.innerText = value === "" ? "0" : value;
    display.scrollLeft = display.scrollWidth;
}

/* Panels */

function closePanels() {
    document.getElementById("scientificPanel").classList.remove("open");
    document.getElementById("historyPanel").classList.remove("open");
    document.getElementById("toolsPanel").classList.remove("open");
}

function toggleScientificPanel() {
    const panel = document.getElementById("scientificPanel");
    const state = panel.classList.contains("open");

    closePanels();

    if (!state) {
        panel.classList.add("open");
    }
}

function toggleHistoryPanel() {
    const panel = document.getElementById("historyPanel");
    const state = panel.classList.contains("open");

    closePanels();

    if (!state) {
        panel.classList.add("open");
    }
}

function toggleToolsPanel() {
    const panel = document.getElementById("toolsPanel");
    const state = panel.classList.contains("open");

    closePanels();

    if (!state) {
        panel.classList.add("open");
    }
}

/* Input */

function appendScientific(value) {
    display.classList.remove("animate-pop");

    if (clearOnNextInput) {
        updateDisplayValue("");
        clearOnNextInput = false;
    }

    let current =
        display.innerText === "0"
            ? ""
            : display.innerText;

    updateDisplayValue(current + value);
    equalClickCount = 0;
}

function appendNumber(value) {
    display.classList.remove("animate-pop");

    if (clearOnNextInput) {
        updateDisplayValue("");
        clearOnNextInput = false;
    }

    let current =
        display.innerText === "0"
            ? ""
            : display.innerText;

    if (value === ".") {
        const parts = current.split(/[\+\-\*\/%^,()]/);
        const currentPart = parts[parts.length - 1];

        if (currentPart.includes(".")) return;
    }

    updateDisplayValue(current + value);
    equalClickCount = 0;
}

function appendOperator(op) {
    display.classList.remove("animate-pop");

    if (clearOnNextInput) {
        clearOnNextInput = false;
    }

    let current =
        display.innerText === "0"
            ? ""
            : display.innerText;

    if (current === "") {
        if (op === "-") {
            updateDisplayValue(op);
        }

        return;
    }

    const last = current.slice(-1);

    if (["+", "-", "*", "/", "%"].includes(last)) {
        updateDisplayValue(
            current.slice(0, -1) + op
        );
    } else {
        updateDisplayValue(current + op);
    }

    equalClickCount = 0;
}

/* Clear */

function clearDisplay() {
    display.classList.remove("animate-pop");

    updateDisplayValue("");

    lastActiveFormula = "";
    finalCalculationResult = "";
    equalClickCount = 0;
}

function deleteLast() {
    display.classList.remove("animate-pop");

    const current = display.innerText;

    updateDisplayValue(
        current.slice(0, -1)
    );

    equalClickCount = 0;
}

/* Calculate */

function calculate() {

    if (
        display.innerText === "" ||
        display.innerText === "0"
    ) {
        return;
    }

    let currentInput = display.innerText;

    const lastChar = currentInput.slice(-1);

    if (
        ["+", "-", "*", "/", "%"].includes(lastChar)
    ) {
        currentInput = currentInput.slice(0, -1);
    }

    /* First numeric calculation sets vault password */

    if (!vaultCode && !isNaN(currentInput)) {

        vaultCode = currentInput;

        localStorage.setItem(
            "vaultCode",
            vaultCode
        );

        updateDisplayValue("Code Set!");

        clearOnNextInput = true;

        calcTitle.innerText =
            "Dilshad's Calc Pro";

        return;
    }

    /* Vault */

    if (
        vaultCode &&
        currentInput === vaultCode
    ) {

        equalClickCount++;

        if (equalClickCount === 2) {
            openVault();
            clearDisplay();
            return;
        }

    } else {
        equalClickCount = 1;
    }

    try {

        lastActiveFormula = currentInput;

        let expression = currentInput
            .replaceAll("×", "*")
            .replaceAll("÷", "/")
            .replaceAll("π", "Math.PI")
            .replaceAll("e^(", "Math.exp(")
            .replaceAll("e", "Math.E")
            .replaceAll("^", "**");

        let result = eval(expression);

        if (result % 1 !== 0) {
            result =
                parseFloat(
                    result.toFixed(8)
                );
        }

        finalCalculationResult = result;

        updateDisplayValue(result);

        clearOnNextInput = true;

        saveToHistory(
            lastActiveFormula,
            finalCalculationResult
        );

        display.classList.remove(
            "animate-pop"
        );

        void display.offsetWidth;

        display.classList.add(
            "animate-pop"
        );

    } catch (error) {

        updateDisplayValue("Error");

        lastActiveFormula = "";
        finalCalculationResult = "";

        clearOnNextInput = true;

        display.classList.add(
            "animate-pop"
        );
    }
}

/* History */

function saveToHistory(formula, result) {

    if (
        historyLog.length > 0 &&
        historyLog[0].formula === formula
    ) {
        return;
    }

    historyLog.unshift({
        formula: formula,
        result: result
    });

    if (historyLog.length > 100) {
        historyLog.pop();
    }

    localStorage.setItem(
        "calcHistory",
        JSON.stringify(historyLog)
    );

    renderHistory();
}

function renderHistory() {

    const container =
        document.getElementById("historyList");

    container.innerHTML = "";

    if (historyLog.length === 0) {

        container.innerHTML =
            '<div class="empty-history">No history records yet</div>';

        return;
    }

    historyLog.forEach(item => {

        const row =
            document.createElement("div");

        row.className = "history-item";

        row.onclick = () =>
            loadHistoryItem(item.result);

        row.innerHTML = `
            <div class="history-formula">
                ${item.formula} =
            </div>

            <div class="history-result">
                ${item.result}
            </div>
        `;

        container.appendChild(row);
    });
}

function loadHistoryItem(value) {

    updateDisplayValue(value);

    finalCalculationResult = value;
    lastActiveFormula = "";
    clearOnNextInput = false;
}

function clearHistory() {

    historyLog = [];

    localStorage.removeItem(
        "calcHistory"
    );

    renderHistory();
}

/* Voice */

function reviseCalculation() {

    window.speechSynthesis.cancel();

    let text = "";

    if (lastActiveFormula !== "") {

        text =
            lastActiveFormula +
            " equals " +
            finalCalculationResult;

    } else if (
        display.innerText !== "" &&
        display.innerText !== "Error" &&
        display.innerText !== "Code Set!"
    ) {

        text = display.innerText;

    } else {

        text = "Zero";
    }

    const spoken =
        text
            .replaceAll("+", " plus ")
            .replaceAll("-", " minus ")
            .replaceAll("*", " multiplied by ")
            .replaceAll("/", " divided by ")
            .replaceAll("×", " multiplied by ")
            .replaceAll("÷", " divided by ")
            .replaceAll("%", " percent ")
            .replaceAll(".", " point ")
            .replaceAll("sin(", " sine of ")
            .replaceAll("cos(", " cosine of ")
            .replaceAll("tan(", " tangent of ")
            .replaceAll("log(", " log base ten of ")
            .replaceAll("ln(", " natural log of ")
            .replaceAll("sqrt(", " square root of ")
            .replaceAll("fact(", " factorial of ")
            .replaceAll("e^(", " e to the power of ")
            .replaceAll("1/(", " inverse of ")
            .replaceAll("^", " to the power of ")
            .replaceAll("(", " open bracket ")
            .replaceAll(")", " close bracket ");

    const utterance =
        new SpeechSynthesisUtterance(spoken);

    utterance.rate = .95;

    window.speechSynthesis.speak(
        utterance
    );
}

/* Vault */

function openVault() {

function closeVault() {

    document
        .getElementById("vaultOverlay")

function handleFileSelect(event) {

    const files = event.target.files;

    let vaultItems =
        JSON.parse(
            localStorage.getItem("vaultItems")
        ) || [];

    for (const file of files) {

        const reader =
            new FileReader();

        reader.onload = function(e) {

            vaultItems.push({
                type:
                    file.type.startsWith("video")
                        ? "video"
                        : "image",

                data: e.target.result
            });

            localStorage.setItem(
                "vaultItems",
                JSON.stringify(vaultItems)
            );

            renderGallery();
        };

        reader.readAsDataURL(file);
    }
}

function renderGallery() {

    const grid =
        document.getElementById(
            "galleryGrid"
        );

    grid.innerHTML = "";

    let vaultItems =
        JSON.parse(
            localStorage.getItem("vaultItems")
        ) || [];

    vaultItems.forEach(
        (item, index) => {

            const container =
                document.createElement("div");

            container.className =
                "gallery-item";

            if (item.type === "video") {

                const video =
                    document.createElement("video");

                video.src = item.data;
                video.controls = true;

                container.appendChild(video);

            } else {

                const img =
                    document.createElement("img");

                img.src = item.data;

                container.appendChild(img);
            }

            const deleteBtn =
                document.createElement("button");

            deleteBtn.className =
                "delete-item-btn";

            deleteBtn.innerHTML = "×";

            deleteBtn.onclick = () => {

                vaultItems.splice(index, 1);

                localStorage.setItem(
                    "vaultItems",
                    JSON.stringify(vaultItems)
                );

                renderGallery();
            };

            container.appendChild(
                deleteBtn
            );

            grid.appendChild(
                container
            );
        }
    );
}

/* Age */

function calcAge() {

    const dobVal =
        document.getElementById(
            "dobInput"
        ).value;

    const targetVal =
        document.getElementById(
            "targetDateInput"
        ).value;

    const result =
        document.getElementById(
            "toolResult"
        );

    if (!dobVal) {
        result.innerText =
            "Please select Date of Birth";
        return;
    }

    const birth =
        new Date(dobVal);

    const target =
        targetVal
            ? new Date(targetVal)
            : new Date();

    if (birth > target) {
        result.innerText =
            "DOB cannot be in the future";
        return;
    }

    let years =
        target.getFullYear() -
        birth.getFullYear();

    let months =
        target.getMonth() -
        birth.getMonth();

    let days =
        target.getDate() -
        birth.getDate();

    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                target.getFullYear(),
                target.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();
    }

    if (months < 0) {

        years--;
        months += 12;
    }

    result.innerText =
        `${years} Years, ${months} Months, ${days} Days`;
}

/* BMI */

function calcBMI() {

    const weight =
        parseFloat(
            document.getElementById(
                "bmiWeight"
            ).value
        );

    const height =
        parseFloat(
            document.getElementById(
                "bmiHeight"
            ).value
        );

    const result =
        document.getElementById(
            "toolResult"
        );

    if (
        !weight ||
        !height ||
        weight <= 0 ||
        height <= 0
    ) {

        result.innerText =
            "Enter valid positive values";

        return;
    }

    const bmi =
        (
            weight /
            ((height / 100) ** 2)
        ).toFixed(2);

    let category = "";

    if (bmi < 18.5)
        category = "Underweight";
    else if (bmi < 24.9)
        category = "Normal weight";
    else if (bmi < 29.9)
        category = "Overweight";
    else
        category = "Obese";

    result.innerText =
        `BMI: ${bmi} (${category})`;
}

/* Discount */

function calcDiscount() {

    const price =
        parseFloat(
            document.getElementById(
                "discPrice"
            ).value
        );

    const discount =
        parseFloat(
            document.getElementById(
                "discPercent"
            ).value
        );

    const result =
        document.getElementById(
            "toolResult"
        );

    if (
        isNaN(price) ||
        isNaN(discount) ||
        price < 0 ||
        discount < 0
    ) {

        result.innerText =
            "Enter valid numbers";

        return;
    }

    const saved =
        (price * (discount / 100))
        .toFixed(2);

    const finalPrice =
        (price - saved)
        .toFixed(2);

    result.innerText =
        `Final Price: ${finalPrice} (Saved: ${saved})`;
}

/* Date Difference */

function calcDateDiff() {

    const start =
        document.getElementById(
            "dateStart"
        ).value;

    const end =
        document.getElementById(
            "dateEnd"
        ).value;

    const result =
        document.getElementById(
            "toolResult"
        );

    if (!start || !end) {

        result.innerText =
            "Select both dates";

        return;
    }

    const date1 =
        new Date(start);

    const date2 =
        new Date(end);

    const difference =
        Math.abs(date2 - date1);

    const days =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const weeks =
        Math.floor(days / 7);

    const remainingDays =
        days % 7;

    result.innerText =
        `${days} Days (${weeks} Weeks, ${remainingDays} Days)`;
}

/* Unit Converter */

function convertUnits(type) {

    const value =
        parseFloat(
            document.getElementById(
                "unitVal"
            ).value
        );

    const from =
        document.getElementById(
            "unitFrom"
        ).value;

    const to =
        document.getElementById(
            "unitTo"
        ).value;

    const resultBox =
        document.getElementById(
            "toolResult"
        );

    if (isNaN(value)) {

        resultBox.innerText =
            "Enter a valid value";

        return;
    }

    let base;
    let result;

    if (type === "distance") {

        const units = {
            Meters: 1,
            Kilometers: 1000,
            Centimeters: .01,
            Miles: 1609.34,
            Feet: .3048,
            Inches: .0254,
            Yards: .9144
        };

        base = value * units[from];
        result = base / units[to];

    } else if (type === "area") {

        const units = {
            "Square Meters": 1,
            "Square Kilometers": 1e6,
            "Square Feet": .092903,
            Acres: 4046.86,
            Hectares: 10000
        };

        base = value * units[from];
        result = base / units[to];

    } else if (type === "data") {

        const units = {
            Bytes: 1,
            KB: 1024,
            MB: 1048576,
            GB: 1073741824,
            TB: 1099511627776
        };

        base = value * units[from];
        result = base / units[to];

    } else if (type === "mass") {

        const units = {
            Kilograms: 1,
            Grams: .001,
            Milligrams: .000001,
            Pounds: .453592,
            Ounces: .0283495
        };

        base = value * units[from];
        result = base / units[to];

    } else if (type === "speed") {

        const units = {
            "m/s": 1,
            "km/h": .277778,
            mph: .44704,
            Knots: .514444
        };

        base = value * units[from];
        result = base / units[to];

    } else if (type === "temp") {

        if (from === to) {
            result = value;

        } else if (from === "Celsius") {

            result =
                to === "Fahrenheit"
                    ? value * 9 / 5 + 32
                    : value + 273.15;

        } else if (from === "Fahrenheit") {

            result =
                to === "Celsius"
                    ? (value - 32) * 5 / 9
                    : ((value - 32) * 5 / 9) + 273.15;

        } else {

            result =
                to === "Celsius"
                    ? value - 273.15
                    : ((value - 273.15) * 9 / 5) + 32;
        }

    } else if (type === "time") {

        const units = {
            Seconds: 1,
            Minutes: 60,
            Hours: 3600,
            Days: 86400,
            Weeks: 604800
        };

        base = value * units[from];
        result = base / units[to];

    } else if (type === "volume") {

        const units = {
            Liters: 1,
            Milliliters: .001,
            "Gallons (US)": 3.78541,
            "Cubic Meters": 1000
        };

        base = value * units[from];
        result = base / units[to];
    }

    result =
        type === "temp"
            ? parseFloat(result.toFixed(2))
            : parseFloat(result.toFixed(6));

    resultBox.innerText =
        `${value} ${from} = ${result} ${to}`;
}
