<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link class="js-meta-icon" rel="icon" type="image/png" href="my_logo.png">
    <link rel="apple-touch-icon" href="my_logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilshad's Calc Pro</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #0d1527;
            overflow-x: hidden;
            padding: 20px 0;
        }

        .calc-card { 
            background: rgba(21, 32, 54, 0.6); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px; 
            border-radius: 28px; 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4); 
            text-align: center; 
            width: 360px; 
            max-width: 95vw;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .logo { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            object-fit: cover;
        }

        h2 { 
            font-size: 18px; 
            font-weight: 600;
            text-align: left;
            color: #ffffff;
            margin: 0;
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .action-row button {
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-toggle-sci {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.3);
            color: #c084fc;
        }
        .btn-toggle-sci:hover { background: #a855f7; color: #0d1527; }

        .btn-toggle-hist {
            background: rgba(234, 179, 8, 0.12);
            border-color: rgba(234, 179, 8, 0.3);
            color: #facc15;
        }
        .btn-toggle-hist:hover { background: #eab308; color: #0d1527; }

        .btn-toggle-tools {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.3);
            color: #34d399;
        }
        .btn-toggle-tools:hover { background: #34d399; color: #0d1527; }

        .btn-revise {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }
        .btn-revise:hover { background: #38bdf8; color: #0d1527; }

        .display-container {
            background: rgba(9, 15, 29, 0.7);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            position: relative;
        }

        .calc-display {
            width: 100%;
            font-size: 34px;
            text-align: right;
            background: transparent;
            color: #38bdf8;
            border: none;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .calc-display::-webkit-scrollbar {
            display: none;
        }

        .animate-pop {
            animation: answerPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
        }

        @keyframes answerPop {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scientific-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-bottom 0.3s ease;
            margin-bottom: 0;
        }

        .scientific-panel.open {
            max-height: 240px;
            margin-bottom: 20px;
        }

        .btn-sci {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: #cbd5e1;
            font-size: 14px;
            padding: 10px 0;
            border-radius: 12px;
            cursor: pointer;
        }

        .history-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-bottom 0.3s ease;
            margin-bottom: 0;
            background: rgba(9, 15, 29, 0.6);
            border-radius: 16px;
            text-align: left;
        }

        .history-panel.open {
            max-height: 180px;
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .history-header span {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        .clear-hist-btn {
            background: transparent;
            border: none;
            color: #f87171;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .history-list {
            max-height: 130px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(234, 179, 8, 0.2);
        }

        .history-formula {
            color: #94a3b8;
            font-size: 11px;
            word-break: break-all;
        }

        .history-result {
            color: #facc15;
            font-weight: 600;
        }

        .empty-history {
            color: #475569;
            font-size: 12px;
            text-align: center;
            padding: 20px 0;
        }

        /* Converter Tools Panel Styles */
        .tools-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), margin-bottom 0.3s ease;
            margin-bottom: 0;
            background: rgba(9, 15, 29, 0.8);
            border-radius: 18px;
            text-align: left;
            padding: 0 14px;
        }

        .tools-panel.open {
            max-height: 420px;
            margin-bottom: 20px;
            padding: 14px;
            overflow-y: auto;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .tool-selector {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: #1e293b;
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            font-weight: 600;
            margin-bottom: 12px;
            outline: none;
            cursor: pointer;
        }

        .tool-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-group label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        .tool-input, .tool-select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 13px;
            outline: none;
        }

        .tool-input:focus, .tool-select:focus {
            border-color: #34d399;
        }

        .tool-row {
            display: flex;
            gap: 8px;
        }

        .tool-row > * {
            flex: 1;
        }

        .btn-calc-tool {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }

        .btn-calc-tool:hover {
            background: #059669;
        }

        .tool-result-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px dashed rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            word-break: break-all;
            margin-top: 4px;
        }

        .buttons { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 12px; 
        }

        button { 
            padding: 16px 0;
            font-size: 22px; 
            font-weight: 600;
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            background: #2b3344; 
            color: #ffffff;
            transition: all 0.15s ease; 
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        button:active { 
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .btn-action {
            background: #2e3648;
            color: #ffffff;
        }

        .operator { 
            background: #2563eb; 
            color: #ffffff;
        }

        .equal { 
            background: #16a34a; 
            color: #ffffff;
        }
        .equal:active {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }

        .vault-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(9, 15, 29, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .vault-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .vault-content {
            background: #152036;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 24px;
            width: 85%;
            max-width: 400px;
            color: white;
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-vault-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
        }

        .file-upload-label {
            display: block;
            background: rgba(37, 99, 235, 0.2);
            color: #3b82f6;
            border: 2px dashed #2563eb;
            padding: 20px;
            border-radius: 14px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
        }

        .gallery-item img, .gallery-item video {
            width: 100%; height: 100%; object-fit: cover;
        }

        .delete-item-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: #ef4444;
            border: none; color: white;
            border-radius: 50%; width: 20px; height: 20px;
            font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div class="calc-card">
    <div class="header-section">
        <h2 id="calc-title">Dilshad's Calc Pro</h2>
        <img src="my_logo.png" alt="Logo" class="logo">
    </div>

    <div class="action-row">
        <button class="btn-toggle-sci" onclick="toggleScientificPanel()">🔬 Mode</button>
        <button class="btn-toggle-hist" onclick="toggleHistoryPanel()">📜 History</button>
        <button class="btn-toggle-tools" onclick="toggleToolsPanel()">📐 Tools</button>
        <button class="btn-revise" onclick="reviseCalculation()">🔊 Revise</button>
    </div>
    
    <div class="display-container" id="displayContainer">
        <div id="display" class="calc-display">0</div>
    </div>

    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span>Previous Logs (Max 100)</span>
            <button class="clear-hist-btn" onclick="clearHistory()">Clear All</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="tools-panel" id="toolsPanel">
        <select class="tool-selector" id="toolTypeSelect" onchange="switchToolSegment()">
            <option value="age">🎂 Exact Age Calculator</option>
            <option value="bmi">⚖️ BMI Calculator</option>
            <option value="distance">📏 Distance Converter</option>
            <option value="area">🗺️ Area Converter</option>
            <option value="data">💾 Data Storage Converter</option>
            <option value="date">📅 Date Difference</option>
            <option value="discount">🏷️ Discount Calculator</option>
            <option value="mass">🏋️ Mass / Weight Converter</option>
            <option value="speed">🚀 Speed Converter</option>
            <option value="temp">🌡️ Temperature Converter</option>
            <option value="time">⏱️ Time Converter</option>
            <option value="volume">🧪 Volume Converter</option>
        </select>
        <div class="tool-body" id="toolBody"></div>
    </div>

    <div class="scientific-panel" id="scientificPanel">
        <button class="btn-sci" onclick="appendScientific('sin(')">sin</button>
        <button class="btn-sci" onclick="appendScientific('cos(')">cos</button>
        <button class="btn-sci" onclick="appendScientific('tan(')">tan</button>
        <button class="btn-sci" onclick="appendScientific('sqrt(')">√</button>
        
        <button class="btn-sci" onclick="appendScientific('log(')">log</button>
        <button class="btn-sci" onclick="appendScientific('ln(')">ln</button>
        <button class="btn-sci" onclick="appendScientific('^')">a^x</button>
        <button class="btn-sci" onclick="appendScientific('fact(')">x!</button>
        
        <button class="btn-sci" onclick="appendScientific('e^(')">e^x</button>
        <button class="btn-sci" onclick="appendScientific('1/(')">inv</button>
        <button class="btn-sci" onclick="appendScientific('π')">π</button>
        <button class="btn-sci" onclick="appendScientific('e')">e</button>

        <button class="btn-sci" onclick="appendScientific('(')" style="background: rgba(255,255,255,0.05);">(</button>
        <button class="btn-sci" onclick="appendScientific(')')" style="background: rgba(255,255,255,0.05);">)</button>
        <button class="btn-sci" onclick="appendScientific(',')" style="background: rgba(255,255,255,0.05);">,</button>
        <button class="btn-sci" style="visibility: hidden;"></button>
    </div>

    <div class="buttons">
        <button class="btn-action" onclick="clearDisplay()">C</button>
        <button class="btn-action" onclick="deleteLast()">DEL</button>
        <button class="btn-action" onclick="appendOperator('%')">%</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>
        
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>
        
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">-</button>
        
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>
        
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()" style="grid-column: span 2;">=</button>
    </div>
</div>

<div id="vaultOverlay" class="vault-overlay">
    <div class="vault-content">
        <div class="vault-header">
            <h3>🔒 Private Vault</h3>
            <button class="close-vault-btn" onclick="closeVault()">Lock</button>
        </div>
        <label class="file-upload-label">
            📁 Upload to Hide Media
            <input type="file" id="vaultInput" accept="image/*,video/*" multiple style="display: none;" onchange="handleFileSelect(event)">
        </label>
        <div id="galleryGrid" class="gallery-grid"></div>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    let calcTitle = document.getElementById('calc-title');
    let clearOnNextInput = false;

    let lastActiveFormula = ""; 
    let finalCalculationResult = "";

    let historyLog = JSON.parse(localStorage.getItem('calcHistory')) || [];
    let vaultCode = localStorage.getItem('vaultCode') || null;
    let equalClickCount = 0;

    const sin = (deg) => Math.sin(deg * Math.PI / 180);
    const cos = (deg) => Math.cos(deg * Math.PI / 180);
    const tan = (deg) => Math.tan(deg * Math.PI / 180);
    const log = (x) => Math.log10(x);
    const ln = (x) => Math.log(x);
    const sqrt = (x) => Math.sqrt(x);
    const fact = (n) => {
        if (n < 0 || !Number.isInteger(n)) return NaN;
        if (n === 0 || n === 1) return 1;
        let r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        return r;
    };

    if (!vaultCode) {
        calcTitle.innerText = "Set Passcode & Press =";
    }
    renderHistory();
    switchToolSegment();

    function updateDisplayValue(newValue) {
        display.innerText = newValue === '' ? '0' : newValue;
        display.scrollLeft = display.scrollWidth;
    }

    function toggleScientificPanel() {
        document.getElementById('historyPanel').classList.remove('open');
        document.getElementById('toolsPanel').classList.remove('open');
        document.getElementById('scientificPanel').classList.toggle('open');
    }

    function toggleHistoryPanel() {
        document.getElementById('scientificPanel').classList.remove('open');
        document.getElementById('toolsPanel').classList.remove('open');
        document.getElementById('historyPanel').classList.toggle('open');
    }

    function toggleToolsPanel() {
        document.getElementById('scientificPanel').classList.remove('open');
        document.getElementById('historyPanel').classList.remove('open');
        document.getElementById('toolsPanel').classList.toggle('open');
    }

    function appendScientific(val) {
        display.classList.remove('animate-pop');
        if (clearOnNextInput) {
            updateDisplayValue('');
            clearOnNextInput = false;
        }
        let currentText = display.innerText === '0' ? '' : display.innerText;
        updateDisplayValue(currentText + val);
        equalClickCount = 0;
    }

    function appendNumber(value) {
        display.classList.remove('animate-pop');
        if (clearOnNextInput) {
            updateDisplayValue('');
            clearOnNextInput = false;
        }
        let currentText = display.innerText === '0' ? '' : display.innerText;
        if (value === '.') {
            const parts = currentText.split(/[\+\-\*\/%^,()]/);
            const currentPart = parts[parts.length - 1];
            if (currentPart.includes('.')) return;
        }
        updateDisplayValue(currentText + value);
        equalClickCount = 0;
    }

    function appendOperator(op) {
        display.classList.remove('animate-pop');
        if (clearOnNextInput) clearOnNextInput = false;
        let currentText = display.innerText === '0' ? '' : display.innerText;
        if (currentText === '') {
            if (op === '-') updateDisplayValue(op);
            return;
        }
        let lastChar = currentText.slice(-1);
        if (['+', '-', '*', '/', '%'].includes(lastChar)) {
            updateDisplayValue(currentText.slice(0, -1) + op);
        } else {
            updateDisplayValue(currentText + op);
        }
        equalClickCount = 0;
    }

    function clearDisplay() {
        display.classList.remove('animate-pop');
        updateDisplayValue('');
        lastActiveFormula = "";
        finalCalculationResult = "";
        equalClickCount = 0;
    }

    function deleteLast() {
        display.classList.remove('animate-pop');
        let currentText = display.innerText;
        updateDisplayValue(currentText.slice(0, -1));
        equalClickCount = 0;
    }

    function calculate() {
        if (display.innerText === '' || display.innerText === '0') return;
        
        let currentInput = display.innerText;
        let lastChar = currentInput.slice(-1);
        if (['+', '-', '*', '/', '%'].includes(lastChar)) {
            currentInput = currentInput.slice(0, -1);
        }

        if (!vaultCode && !isNaN(currentInput)) {
            vaultCode = currentInput;
            localStorage.setItem('vaultCode', vaultCode);
            updateDisplayValue("Code Set!");
            clearOnNextInput = true;
            calcTitle.innerText = "Dilshad's Calc Pro";
            return;
        }

        if (vaultCode && currentInput === vaultCode) {
            equalClickCount++;
            if (equalClickCount === 2) {
                openVault();
                clearDisplay();
                return;
            }
        } else {
            equalClickCount = 1;
        }

        try {
            lastActiveFormula = currentInput;
            
            let executableExpression = currentInput
                .replaceAll('×', '*')
                .replaceAll('÷', '/')
                .replaceAll('π', 'Math.PI')
                .replaceAll('e^(', 'Math.exp(')
                .replaceAll('e', 'Math.E')
                .replaceAll('^', '**');

            let result = eval(executableExpression);
            
            if (result % 1 !== 0) {
                result = parseFloat(result.toFixed(8));
            }
            
            finalCalculationResult = result;
            updateDisplayValue(result);
            clearOnNextInput = true;

            saveToHistory(lastActiveFormula, finalCalculationResult);

            display.classList.remove('animate-pop');
            void display.offsetWidth; 
            display.classList.add('animate-pop');
        } catch (error) {
            updateDisplayValue("Error");
            lastActiveFormula = "";
            finalCalculationResult = "";
            clearOnNextInput = true;
            display.classList.add('animate-pop');
        }
    }

    function saveToHistory(formula, result) {
        if(historyLog.length > 0 && historyLog[0].formula === formula) return;

        historyLog.unshift({ formula: formula, result: result });
        
        if (historyLog.length > 100) {
            historyLog.pop();
        }
        
        localStorage.setItem('calcHistory', JSON.stringify(historyLog));
        renderHistory();
    }

    function renderHistory() {
        const listContainer = document.getElementById('historyList');
        listContainer.innerHTML = '';

        if (historyLog.length === 0) {
            listContainer.innerHTML = '<div class="empty-history">No history records yet</div>';
            return;
        }

        historyLog.forEach((item) => {
            const row = document.createElement('div');
            row.className = 'history-item';
            row.onclick = () => loadHistoryItem(item.result);
            
            row.innerHTML = `
                <div class="history-formula">${item.formula} =</div>
                <div class="history-result">${item.result}</div>
            `;
            listContainer.appendChild(row);
        });
    }

    function loadHistoryItem(value) {
        updateDisplayValue(value);
        finalCalculationResult = value;
        lastActiveFormula = "";
        clearOnNextInput = false;
    }

    function clearHistory() {
        historyLog = [];
        localStorage.removeItem('calcHistory');
        renderHistory();
    }

    function reviseCalculation() {
        window.speechSynthesis.cancel();
        let contextToSpeak = "";

        if (lastActiveFormula !== "") {
            contextToSpeak = lastActiveFormula + " equals " + finalCalculationResult;
        } else if (display.innerText !== "" && display.innerText !== "Error" && display.innerText !== "Code Set!") {
            contextToSpeak = display.innerText;
        } else {
            contextToSpeak = "Zero";
        }

        let audioString = contextToSpeak
            .replaceAll('+', ' plus ')
            .replaceAll('-', ' minus ')
            .replaceAll('*', ' multiplied by ')
            .replaceAll('/', ' divided by ')
            .replaceAll('×', ' multiplied by ')
            .replaceAll('÷', ' divided by ')
            .replaceAll('%', ' percent ')
            .replaceAll('.', ' point ')
            .replaceAll('sin(', ' sine of ')
            .replaceAll('cos(', ' cosine of ')
            .replaceAll('tan(', ' tangent of ')
            .replaceAll('log(', ' log base ten of ')
            .replaceAll('ln(', ' natural log of ')
            .replaceAll('sqrt(', ' square root of ')
            .replaceAll('fact(', ' factorial of ')
            .replaceAll('e^(', ' e to the power of ')
            .replaceAll('1/(', ' inverse of ')
            .replaceAll('^', ' to the power of ')
            .replaceAll('(', ' open bracket ')
            .replaceAll(')', ' close bracket ');

        let voiceUtterance = new SpeechSynthesisUtterance(audioString);
        voiceUtterance.rate = 0.95; 
        window.speechSynthesis.speak(voiceUtterance);
    }

    function openVault() {
        document.getElementById('vaultOverlay').classList.add('active');
        renderGallery();
    }

    function closeVault() {
        document.getElementById('vaultOverlay').classList.remove('active');
        equalClickCount = 0;
    }

    function handleFileSelect(event) {
        const files = event.target.files;
        let vaultItems = JSON.parse(localStorage.getItem('vaultItems')) || [];

        for (let file of files) {
            const reader = new FileReader();
            reader.onload = function(e) {
                vaultItems.push({
                    type: file.type.startsWith('video') ? 'video' : 'image',
                    data: e.target.result
                });
                localStorage.setItem('vaultItems', JSON.stringify(vaultItems));
                renderGallery();
            };
            reader.readAsDataURL(file);
        }
    }

    function renderGallery() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = '';
        let vaultItems = JSON.parse(localStorage.getItem('vaultItems')) || [];

        vaultItems.forEach((item, index) => {
            const container = document.createElement('div');
            container.className = 'gallery-item';

            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.data;
                video.controls = true;
                container.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = item.data;
                container.appendChild(img);
            }

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-item-btn';
            deleteBtn.innerHTML = '×';

            deleteBtn.onclick = () => {
                vaultItems.splice(index, 1);
                localStorage.setItem('vaultItems', JSON.stringify(vaultItems));
                renderGallery();
            };

            container.appendChild(deleteBtn);
            grid.appendChild(container);
        });
    }

    /* --- CONVERTERS & TOOLS SYSTEM --- */
    function switchToolSegment() {
        const type = document.getElementById('toolTypeSelect').value;
        const body = document.getElementById('toolBody');
        body.innerHTML = '';

        if (type === 'age') {
            body.innerHTML = `
                <div class="tool-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dobInput" class="tool-input">
                </div>
                <div class="tool-group">
                    <label>Target Date</label>
                    <input type="date" id="targetDateInput" class="tool-input" value="${new Date().toISOString().split('T')[0]}">
                </div>
                <button class="btn-calc-tool" onclick="calcAge()">Calculate Age</button>
                <div class="tool-result-box" id="toolResult">Select DOB to calculate</div>
            `;
        } else if (type === 'bmi') {
            body.innerHTML = `
                <div class="tool-row">
                    <div class="tool-group">
                        <label>Weight (kg)</label>
                        <input type="number" id="bmiWeight" class="tool-input" placeholder="e.g. 70">
                    </div>
                    <div class="tool-group">
                        <label>Height (cm)</label>
                        <input type="number" id="bmiHeight" class="tool-input" placeholder="e.g. 175">
                    </div>
                </div>
                <button class="btn-calc-tool" onclick="calcBMI()">Calculate BMI</button>
                <div class="tool-result-box" id="toolResult">Enter details</div>
            `;
        } else if (type === 'discount') {
            body.innerHTML = `
                <div class="tool-row">
                    <div class="tool-group">
                        <label>Original Price</label>
                        <input type="number" id="discPrice" class="tool-input" placeholder="Price">
                    </div>
                    <div class="tool-group">
                        <label>Discount (%)</label>
                        <input type="number" id="discPercent" class="tool-input" placeholder="%">
                    </div>
                </div>
                <button class="btn-calc-tool" onclick="calcDiscount()">Calculate Discount</button>
                <div class="tool-result-box" id="toolResult">Enter price and discount</div>
            `;
        } else if (type === 'date') {
            body.innerHTML = `
                <div class="tool-group">
                    <label>Start Date</label>
                    <input type="date" id="dateStart" class="tool-input">
                </div>
                <div class="tool-group">
                    <label>End Date</label>
                    <input type="date" id="dateEnd" class="tool-input" value="${new Date().toISOString().split('T')[0]}">
                </div>
                <button class="btn-calc-tool" onclick="calcDateDiff()">Calculate Difference</button>
                <div class="tool-result-box" id="toolResult">Select dates</div>
            `;
        } else {
            // General Unit Converters
            const units = {
                distance: ['Meters', 'Kilometers', 'Centimeters', 'Miles', 'Feet', 'Inches', 'Yards'],
                area: ['Square Meters', 'Square Kilometers', 'Square Feet', 'Acres', 'Hectares'],
                data: ['Bytes', 'KB', 'MB', 'GB', 'TB'],
                mass: ['Kilograms', 'Grams', 'Milligrams', 'Pounds', 'Ounces'],
                speed: ['km/h', 'm/s', 'mph', 'Knots'],
                temp: ['Celsius', 'Fahrenheit', 'Kelvin'],
                time: ['Seconds', 'Minutes', 'Hours', 'Days', 'Weeks'],
                volume: ['Liters', 'Milliliters', 'Gallons (US)', 'Cubic Meters']
            };

            const selectedUnits = units[type];
            let options = selectedUnits.map(u => `<option value="${u}">${u}</option>`).join('');

            body.innerHTML = `
                <div class="tool-group">
                    <label>Value</label>
                    <input type="number" id="unitVal" class="tool-input" placeholder="Enter value" oninput="convertUnits('${type}')">
                </div>
                <div class="tool-row">
                    <div class="tool-group">
                        <label>From</label>
                        <select id="unitFrom" class="tool-select" onchange="convertUnits('${type}')">${options}</select>
                    </div>
                    <div class="tool-group">
                        <label>To</label>
                        <select id="unitTo" class="tool-select" onchange="convertUnits('${type}')">${options}</select>
                    </div>
                </div>
                <div class="tool-result-box" id="toolResult" style="margin-top:10px;">Result will appear here</div>
            `;
            if (selectedUnits.length > 1) {
                document.getElementById('unitTo').selectedIndex = 1;
            }
        }
    }

    function calcAge() {
        const dobVal = document.getElementById('dobInput').value;
        const targetVal = document.getElementById('targetDateInput').value;
        if (!dobVal) {
            document.getElementById('toolResult').innerText = "Please select Date of Birth";
            return;
        }
        let birth = new Date(dobVal);
        let target = targetVal ? new Date(targetVal) : new Date();

        if (birth > target) {
            document.getElementById('toolResult').innerText = "DOB cannot be in the future";
            return;
        }

        let years = target.getFullYear() - birth.getFullYear();
        let months = target.getMonth() - birth.getMonth();
        let days = target.getDate() - birth.getDate();

        if (days < 0) {
            months--;
            let prevMonth = new Date(target.getFullYear(), target.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById('toolResult').innerText = `${years} Years, ${months} Months, ${days} Days`;
    }

    function calcBMI() {
        const w = parseFloat(document.getElementById('bmiWeight').value);
        const h = parseFloat(document.getElementById('bmiHeight').value);

        if (!w || !h || w <= 0 || h <= 0) {
            document.getElementById('toolResult').innerText = "Enter valid positive values";
            return;
        }

        const bmi = (w / ((h / 100) * (h / 100))).toFixed(2);
        let cat = "";
        if (bmi < 18.5) cat = "Underweight";
        else if (bmi < 24.9) cat = "Normal weight";
        else if (bmi < 29.9) cat = "Overweight";
        else cat = "Obese";

        document.getElementById('toolResult').innerText = `BMI: ${bmi} (${cat})`;
    }

    function calcDiscount() {
        const p = parseFloat(document.getElementById('discPrice').value);
        const d = parseFloat(document.getElementById('discPercent').value);

        if (isNaN(p) || isNaN(d) || p < 0 || d < 0) {
            document.getElementById('toolResult').innerText = "Enter valid numbers";
            return;
        }

        const saved = (p * (d / 100)).toFixed(2);
        const finalP = (p - saved).toFixed(2);

        document.getElementById('toolResult').innerText = `Final Price: ${finalP} (Saved: ${saved})`;
    }

    function calcDateDiff() {
        const d1 = document.getElementById('dateStart').value;
        const d2 = document.getElementById('dateEnd').value;

        if (!d1 || !d2) {
            document.getElementById('toolResult').innerText = "Select both dates";
            return;
        }

        const date1 = new Date(d1);
        const date2 = new Date(d2);
        const diffTime = Math.abs(date2 - date1);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const weeks = Math.floor(diffDays / 7);
        const remDays = diffDays % 7;

        document.getElementById('toolResult').innerText = `${diffDays} Days (${weeks} Weeks, ${remDays} Days)`;
    }

    function convertUnits(type) {
        const val = parseFloat(document.getElementById('unitVal').value);
        const from = document.getElementById('unitFrom').value;
        const to = document.getElementById('unitTo').value;
        const resBox = document.getElementById('toolResult');

        if (isNaN(val)) {
            resBox.innerText = "Enter a valid value";
            return;
        }

        let baseVal = val;
        let res = 0;

        if (type === 'distance') {
            const toMeters = { Meters: 1, Kilometers: 1000, Centimeters: 0.01, Miles: 1609.34, Feet: 0.3048, Inches: 0.0254, Yards: 0.9144 };
            baseVal = val * toMeters[from];
            res = baseVal / toMeters[to];
        } else if (type === 'area') {
            const toSqM = { 'Square Meters': 1, 'Square Kilometers': 1e6, 'Square Feet': 0.092903, Acres: 4046.86, Hectares: 10000 };
            baseVal = val * toSqM[from];
            res = baseVal / toSqM[to];
        } else if (type === 'data') {
            const toBytes = { Bytes: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 };
            baseVal = val * toBytes[from];
            res = baseVal / toBytes[to];
        } else if (type === 'mass') {
            const toKg = { Kilograms: 1, Grams: 0.001, Milligrams: 0.000001, Pounds: 0.453592, Ounces: 0.0283495 };
            baseVal = val * toKg[from];
            res = baseVal / toKg[to];
        } else if (type === 'speed') {
            const toMs = { 'm/s': 1, 'km/h': 0.277778, mph: 0.44704, Knots: 0.514444 };
            baseVal = val * toMs[from];
            res = baseVal / toMs[to];
        } else if (type === 'temp') {
            if (from === to) res = val;
            else if (from === 'Celsius') res = to === 'Fahrenheit' ? (val * 9/5) + 32 : val + 273.15;
            else if (from === 'Fahrenheit') res = to === 'Celsius' ? (val - 32) * 5/9 : ((val - 32) * 5/9) + 273.15;
            else if (from === 'Kelvin') res = to === 'Celsius' ? val - 273.15 : ((val - 273.15) * 9/5) + 32;
        } else if (type === 'time') {
            const toSec = { Seconds: 1, Minutes: 60, Hours: 3600, Days: 86400, Weeks: 604800 };
            baseVal = val * toSec[from];
            res = baseVal / toSec[to];
        } else if (type === 'volume') {
            const toLiters = { Liters: 1, Milliliters: 0.001, 'Gallons (US)': 3.78541, 'Cubic Meters': 1000 };
            baseVal = val * toLiters[from];
            res = baseVal / toLiters[to];
        }

        if (type !== 'temp') {
            res = parseFloat(res.toFixed(6));
        } else {
            res = parseFloat(res.toFixed(2));
        }

        resBox.innerText = `${val} ${from} = ${res} ${to}`;
    }
</script>
