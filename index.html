<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="my_logo.png">
<link rel="apple-touch-icon" href="my_logo.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Dilshad's Calc Pro</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg-1:#050b16;
    --bg-2:#0a1425;
    --card:rgba(15,27,46,.78);
    --text:#f8fafc;
    --muted:#94a3b8;
    --blue:#38bdf8;
    --green:#22c55e;
    --green-light:#34d399;
    --purple:#a855f7;
    --yellow:#facc15;
    --red:#ef4444;
    --orange:#fb923c;
    --border:rgba(255,255,255,.075);
    --shadow:
        0 30px 80px rgba(0,0,0,.45),
        0 10px 30px rgba(0,0,0,.25);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        "Segoe UI",
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    min-height:100vh;
    margin:0;
    padding:25px 12px;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(37,99,235,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(168,85,247,.13),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--bg-1),
            var(--bg-2)
        );

    color:var(--text);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    left:-180px;
    top:-180px;
    background:rgba(56,189,248,.08);
    filter:blur(100px);
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    right:-180px;
    bottom:-180px;
    background:rgba(168,85,247,.08);
    filter:blur(100px);
    pointer-events:none;
}

/* =========================================================
   MAIN CARD
========================================================= */

.calc-card{
    width:390px;
    max-width:96vw;
    padding:22px;
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(24,39,64,.88),
            rgba(9,18,33,.82)
        );

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:1px solid var(--border);
    box-shadow:var(--shadow);

    position:relative;
    z-index:2;
    overflow:hidden;
}

.calc-card::before{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:70%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(56,189,248,.7),
            transparent
        );
}

/* =========================================================
   HEADER
========================================================= */

.header-section{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 4px;
}

.brand-area{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:43px;
    height:43px;
    border-radius:13px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 8px 20px rgba(0,0,0,.3),
        0 0 20px rgba(56,189,248,.08);
}

.brand-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.brand-name{
    color:#fff;
    font-size:17px;
    font-weight:700;
    letter-spacing:-.3px;
}

.brand-subtitle{
    color:#64748b;
    font-size:9px;
    margin-top:2px;
    letter-spacing:.7px;
    text-transform:uppercase;
}

/* =========================================================
   TOP ACTIONS
========================================================= */

.action-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-bottom:17px;
}

.action-row button{
    border:1px solid rgba(255,255,255,.07);
    padding:9px 3px;
    border-radius:12px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.action-row button:hover{
    transform:translateY(-2px);
}

.btn-toggle-sci{
    background:rgba(168,85,247,.12);
    border-color:rgba(168,85,247,.3)!important;
    color:#c084fc;
}

.btn-toggle-hist{
    background:rgba(234,179,8,.1);
    border-color:rgba(234,179,8,.28)!important;
    color:#facc15;
}

.btn-toggle-tools{
    background:rgba(52,211,153,.1);
    border-color:rgba(52,211,153,.28)!important;
    color:#34d399;
}

.btn-revise{
    background:rgba(56,189,248,.1);
    border-color:rgba(56,189,248,.28)!important;
    color:#38bdf8;
}

/* =========================================================
   DISPLAY
========================================================= */

.display-container{
    background:
        linear-gradient(
            145deg,
            rgba(2,8,20,.88),
            rgba(9,18,33,.72)
        );

    border-radius:20px;
    padding:21px 18px;
    margin-bottom:18px;
    min-height:82px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    overflow:hidden;
    position:relative;

    border:1px solid rgba(255,255,255,.045);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        inset 0 -10px 30px rgba(0,0,0,.18);
}

.display-container::after{
    content:"";
    position:absolute;
    bottom:0;
    right:12%;
    width:35%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(56,189,248,.45),
            transparent
        );
}

.calc-display{
    width:100%;
    font-size:34px;
    font-weight:500;
    line-height:1.2;
    text-align:right;

    background:transparent;
    color:var(--blue);

    border:none;
    outline:none;

    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
}

.calc-display::-webkit-scrollbar{
    display:none;
}

.animate-pop{
    animation:
        answerPop .3s
        cubic-bezier(.175,.885,.32,1.2)
        forwards;
}

@keyframes answerPop{
    0%{
        transform:scale(.95);
        opacity:.6;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* =========================================================
   PANELS
========================================================= */

.scientific-panel,
.history-panel,
.tools-panel{
    overflow:hidden;
    transition:
        max-height .35s ease,
        margin-bottom .3s ease,
        padding .3s ease;
}

/* =========================================================
   SCIENTIFIC
========================================================= */

.scientific-panel{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    max-height:0;
    margin-bottom:0;
}

.scientific-panel.open{
    max-height:250px;
    margin-bottom:18px;
}

.btn-sci{
    background:rgba(30,41,59,.72);
    border:1px solid rgba(255,255,255,.045);
    color:#cbd5e1;
    font-size:13px;
    padding:11px 0;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.btn-sci:hover{
    background:rgba(56,189,248,.12);
    color:#fff;
}

.btn-sci:active{
    transform:scale(.94);
}

/* =========================================================
   HISTORY
========================================================= */

.history-panel{
    max-height:0;
    background:rgba(5,12,24,.72);
    border-radius:18px;
    text-align:left;
    padding:0 13px;
    margin-bottom:0;
}

.history-panel.open{
    max-height:230px;
    margin-bottom:18px;
    padding:13px;
    border:1px solid rgba(255,255,255,.05);
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.history-header span{
    font-size:11px;
    color:#94a3b8;
    font-weight:700;
}

.clear-hist-btn{
    background:transparent;
    border:none;
    color:#f87171;
    font-size:10px;
    cursor:pointer;
    padding:3px 6px;
}

.history-list{
    max-height:170px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.history-item{
    background:rgba(255,255,255,.035);
    border-radius:10px;
    padding:9px 10px;
    font-size:12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    border:1px solid transparent;
}

.history-item:hover{
    background:rgba(255,255,255,.065);
    border-color:rgba(234,179,8,.2);
}

.history-formula{
    color:#94a3b8;
    font-size:10px;
    word-break:break-all;
}

.history-result{
    color:#facc15;
    font-weight:700;
}

.empty-history{
    color:#475569;
    font-size:11px;
    text-align:center;
    padding:22px 0;
}

/* =========================================================
   TOOLS
========================================================= */

.tools-panel{
    max-height:0;

    background:
        linear-gradient(
            145deg,
            rgba(5,15,25,.94),
            rgba(8,20,31,.88)
        );

    border-radius:20px;
    text-align:left;
    padding:0 14px;
    margin-bottom:0;
}

.tools-panel.open{
    max-height:2500px;
    margin-bottom:18px;
    padding:14px;

    border:1px solid rgba(52,211,153,.16);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.02);
}

.tools-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.tools-title strong{
    font-size:13px;
}

.tools-title span{
    font-size:9px;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:.8px;
}

/* =========================================================
   TOOL CATEGORY TABS
========================================================= */

.tool-categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:10px;
}

.tool-category{
    border:1px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.035);
    color:#94a3b8;
    padding:9px 3px;
    border-radius:10px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
}

.tool-category.active{
    background:rgba(56,189,248,.12);
    border-color:rgba(56,189,248,.35);
    color:#38bdf8;
}

/* =========================================================
   TOOL SEGMENTS
========================================================= */

.tool-segments{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:13px;

    max-height:230px;
    overflow-y:auto;
    padding-right:2px;
}

.tool-segment{
    border:1px solid rgba(255,255,255,.055);
    background:rgba(255,255,255,.035);
    color:#94a3b8;

    padding:9px 4px;
    border-radius:10px;

    font-size:9px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.tool-segment:hover{
    background:rgba(52,211,153,.08);
    color:#d1fae5;
}

.tool-segment.active{
    background:
        linear-gradient(
            135deg,
            rgba(16,185,129,.24),
            rgba(52,211,153,.08)
        );

    border-color:rgba(52,211,153,.42);
    color:#34d399;
}

/* =========================================================
   TOOL BODY
========================================================= */

.tool-body{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.tool-group{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.tool-group label{
    font-size:10px;
    color:#94a3b8;
    font-weight:700;
}

.tool-input,
.tool-select{
    width:100%;
    padding:10px 11px;

    border-radius:11px;

    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);

    color:white;
    font-size:12px;
    outline:none;
}

.tool-input:focus,
.tool-select:focus{
    border-color:rgba(52,211,153,.6);
    background:rgba(52,211,153,.035);
}

.tool-select option{
    background:#0f1b2d;
    color:white;
}

.tool-row{
    display:flex;
    gap:8px;
}

.tool-row>*{
    flex:1;
}

.tool-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.btn-calc-tool{
    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    color:white;
    border:none;

    padding:11px;
    border-radius:11px;

    font-size:12px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
}

.btn-calc-tool:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(16,185,129,.18);
}

.btn-secondary{
    background:rgba(56,189,248,.12);
    border:1px solid rgba(56,189,248,.3);
    color:#38bdf8;
    padding:10px;
    border-radius:10px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.btn-danger{
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3);
    color:#f87171;
    padding:10px;
    border-radius:10px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.tool-result-box{
    background:rgba(16,185,129,.08);
    border:1px dashed rgba(16,185,129,.3);
    color:#34d399;

    padding:11px;
    border-radius:11px;

    font-size:12px;
    font-weight:700;
    text-align:center;

    word-break:break-word;
    min-height:39px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.tool-description{
    font-size:9px;
    color:#64748b;
    line-height:1.4;
    text-align:center;
}

.result-positive{
    color:#34d399!important;
}

.result-negative{
    color:#f87171!important;
    border-color:rgba(239,68,68,.3)!important;
    background:rgba(239,68,68,.08)!important;
}

.result-neutral{
    color:#38bdf8!important;
}

/* =========================================================
   P2P BOOK
========================================================= */

.p2p-section{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.p2p-card{
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:10px;
}

.p2p-card h4{
    margin:0 0 9px;
    font-size:11px;
}

.buy-title{
    color:#34d399;
}

.sell-title{
    color:#38bdf8;
}

.p2p-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:6px;
    margin-bottom:7px;
}

.p2p-row input{
    min-width:0;
}

.remove-row{
    width:34px;
    border-radius:9px;
    border:1px solid rgba(239,68,68,.25);
    background:rgba(239,68,68,.08);
    color:#f87171;
    cursor:pointer;
}

.add-row{
    width:100%;
    border:1px dashed rgba(52,211,153,.35);
    background:rgba(52,211,153,.06);
    color:#34d399;
    padding:8px;
    border-radius:9px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
}

.p2p-summary{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.summary-item{
    background:rgba(255,255,255,.035);
    border-radius:10px;
    padding:9px;
}

.summary-label{
    color:#64748b;
    font-size:8px;
    display:block;
    margin-bottom:3px;
}

.summary-value{
    color:#f8fafc;
    font-size:11px;
    font-weight:800;
    word-break:break-word;
}

.summary-value.green{
    color:#34d399;
}

.summary-value.red{
    color:#f87171;
}

.summary-value.blue{
    color:#38bdf8;
}

.summary-value.yellow{
    color:#facc15;
}

/* =========================================================
   TRADE JOURNAL
========================================================= */

.journal-list{
    max-height:300px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.journal-item{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);
    padding:9px;
    border-radius:10px;
    font-size:10px;
}

.journal-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:4px;
}

.journal-profit{
    color:#34d399;
    font-weight:800;
}

.journal-loss{
    color:#f87171;
    font-weight:800;
}

/* =========================================================
   CALCULATOR BUTTONS
========================================================= */

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.buttons button{
    padding:16px 0;
    font-size:21px;
    font-weight:600;

    border:none;
    border-radius:15px;

    cursor:pointer;

    background:
        linear-gradient(
            145deg,
            #303b50,
            #252e3f
        );

    color:#fff;
    transition:.15s;
}

.buttons button:hover{
    background:
        linear-gradient(
            145deg,
            #37445a,
            #293448
        );
}

.buttons button:active{
    transform:scale(.92);
    box-shadow:0 0 20px rgba(56,189,248,.3);
}

.btn-action{
    background:
        linear-gradient(
            145deg,
            #394458,
            #2b3446
        )!important;

    color:#e2e8f0!important;
}

.operator{
    background:
        linear-gradient(
            145deg,
            #2563eb,
            #1d4ed8
        )!important;
}

.equal{
    background:
        linear-gradient(
            145deg,
            #16a34a,
            #15803d
        )!important;
}

/* =========================================================
   VAULT
========================================================= */

.vault-overlay{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;

    background:rgba(3,8,17,.96);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    z-index:999;

    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    pointer-events:none;

    transition:opacity .3s;
    padding:20px;
}

.vault-overlay.active{
    opacity:1;
    pointer-events:auto;
}

.vault-content{
    background:
        linear-gradient(
            145deg,
            #15243a,
            #0c1729
        );

    border:1px solid rgba(255,255,255,.07);
    padding:22px;
    border-radius:24px;

    width:100%;
    max-width:400px;

    color:white;

    box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.vault-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.vault-header h3{
    margin:0;
    font-size:18px;
}

.close-vault-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:8px 15px;
    font-size:12px;
    font-weight:700;
    border-radius:10px;
    cursor:pointer;
}

.file-upload-label{
    display:block;
    background:rgba(37,99,235,.12);
    color:#60a5fa;
    border:2px dashed rgba(37,99,235,.65);
    padding:20px;
    border-radius:14px;
    cursor:pointer;
    text-align:center;
    font-weight:700;
    font-size:13px;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px;
    max-height:240px;
    overflow-y:auto;
}

.gallery-item{
    position:relative;
    aspect-ratio:1;
    border-radius:9px;
    overflow:hidden;
    background:#020617;
}

.gallery-item img,
.gallery-item video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.delete-item-btn{
    position:absolute;
    top:3px;
    right:3px;

    background:#ef4444;
    border:none;
    color:white;

    border-radius:50%;
    width:21px;
    height:21px;

    font-size:13px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

    body{
        padding:12px 8px;
    }

    .calc-card{
        padding:17px;
        border-radius:25px;
    }

    .calc-display{
        font-size:29px;
    }

    .buttons{
        gap:8px;
    }

    .buttons button{
        padding:15px 0;
        font-size:19px;
        border-radius:14px;
    }

    .tool-segments{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:350px){

    .calc-card{
        padding:13px;
    }

    .action-row button{
        font-size:8px;
    }

    .buttons button{
        font-size:17px;
    }

    .tool-segment{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div class="calc-card">

<!-- =========================================================
HEADER
========================================================= -->

<div class="header-section">

    <div class="brand-area">

        <img
            src="my_logo.png"
            alt="Dilshad's Calc Pro Logo"
            class="logo"
        >

        <div class="brand-text">

            <div
                class="brand-name"
                id="calc-title"
            >
                Dilshad's Calc Pro
            </div>

            <div class="brand-subtitle">
                Smart • Scientific • Trader • P2P

<script>

/* =========================================================
CORE CALCULATOR
========================================================= */

const display =
    document.getElementById("display");

const calcTitle =
    document.getElementById("calc-title");

let clearOnNextInput=false;
let lastActiveFormula="";
let finalCalculationResult="";

let historyLog =
    JSON.parse(
        localStorage.getItem("calcHistory")
    ) || [];

let vaultCode =
    localStorage.getItem("vaultCode") || null;

let equalClickCount=0;

/* =========================================================
SCIENTIFIC FUNCTIONS
========================================================= */

const sin =
    deg => Math.sin(deg*Math.PI/180);

const cos =
    deg => Math.cos(deg*Math.PI/180);

const tan =
    deg => Math.tan(deg*Math.PI/180);

const log =
    x => Math.log10(x);

const ln =
    x => Math.log(x);

const sqrt =
    x => Math.sqrt(x);

const fact = n => {

    if(
        n<0 ||
        !Number.isInteger(n)
    ) return NaN;

    if(n===0 || n===1)
        return 1;

    let r=1;

    for(let i=2;i<=n;i++)
        r*=i;

    return r;
};

/* =========================================================
INIT
========================================================= */

if(!vaultCode){

    calcTitle.innerText =
        "Set Passcode & Press =";

}

renderHistory();
selectTool("distance");

/* =========================================================
DISPLAY
========================================================= */

function updateDisplayValue(value){

    display.innerText =
        value==="" ? "0" : value;

    display.scrollLeft =
        display.scrollWidth;
}

/* =========================================================
PANELS
========================================================= */

function closeAllPanels(){

    document
        .getElementById("scientificPanel")
        .classList.remove("open");

    document
        .getElementById("historyPanel")
        .classList.remove("open");

    document
        .getElementById("toolsPanel")
        .classList.remove("open");
}

function toggleScientificPanel(){

    const p =
        document.getElementById(
            "scientificPanel"
        );

    const open =
        p.classList.contains("open");

    closeAllPanels();

    if(!open)
        p.classList.add("open");
}

function toggleHistoryPanel(){

    const p =
        document.getElementById(
            "historyPanel"
        );

    const open =
        p.classList.contains("open");

    closeAllPanels();

    if(!open)
        p.classList.add("open");
}

function toggleToolsPanel(){

    const p =
        document.getElementById(
            "toolsPanel"
        );

    const open =
        p.classList.contains("open");

    closeAllPanels();

    if(!open)
        p.classList.add("open");
}

/* =========================================================
CALCULATOR INPUT
========================================================= */

function appendScientific(val){

    display.classList.remove(
        "animate-pop"
    );

    if(clearOnNextInput){

        updateDisplayValue("");
        clearOnNextInput=false;

    }

    let current =
        display.innerText==="0"
            ? ""
            : display.innerText;

    updateDisplayValue(
        current+val
    );

    equalClickCount=0;
}

function appendNumber(value){

    display.classList.remove(
        "animate-pop"
    );

    if(clearOnNextInput){

        updateDisplayValue("");
        clearOnNextInput=false;

    }

    let current =
        display.innerText==="0"
            ? ""
            : display.innerText;

    if(value==="."){

        const parts =
            current.split(
                /[\+\-\*\/%^,()]/
            );

        const currentPart =
            parts[parts.length-1];

        if(currentPart.includes("."))
            return;
    }

    updateDisplayValue(
        current+value
    );

    equalClickCount=0;
}

function appendOperator(op){

    display.classList.remove(
        "animate-pop"
    );

    if(clearOnNextInput)
        clearOnNextInput=false;

    let current =
        display.innerText==="0"
            ? ""
            : display.innerText;

    if(current===""){

        if(op==="-")
            updateDisplayValue(op);

        return;
    }

    const last =
        current.slice(-1);

    if(
        ["+","-","*","/","%"]
        .includes(last)
    ){

        updateDisplayValue(
            current.slice(0,-1)+op
        );

    }else{

        updateDisplayValue(
            current+op
        );

    }

    equalClickCount=0;
}

function clearDisplay(){

    display.classList.remove(
        "animate-pop"
    );

    updateDisplayValue("");

    lastActiveFormula="";
    finalCalculationResult="";
    equalClickCount=0;
}

function deleteLast(){

    display.classList.remove(
        "animate-pop"
    );

    updateDisplayValue(
        display.innerText.slice(0,-1)
    );

    equalClickCount=0;
}

/* =========================================================
CALCULATION ENGINE
========================================================= */

function calculate(){

    if(
        display.innerText==="" ||
        display.innerText==="0"
    ) return;

    let currentInput =
        display.innerText;

    const last =
        currentInput.slice(-1);

    if(
        ["+","-","*","/","%"]
        .includes(last)
    ){

        currentInput =
            currentInput.slice(0,-1);
    }

    /* PRIVATE VAULT PASSCODE */

    if(
        !vaultCode &&
        !isNaN(currentInput) &&
        currentInput!==""
    ){

        vaultCode=currentInput;

        localStorage.setItem(
            "vaultCode",
            vaultCode
        );

        updateDisplayValue(
            "Code Set!"
        );

        clearOnNextInput=true;

        calcTitle.innerText =
            "Dilshad's Calc Pro";

        return;
    }

    /* PRIVATE VAULT ACCESS */

    if(
        vaultCode &&
        currentInput===vaultCode
    ){

        equalClickCount++;

        if(equalClickCount===2){

            openVault();
            clearDisplay();
            return;
        }

    }else{

        equalClickCount=1;
    }

    /* ACTUAL CALCULATION */

    try{

        lastActiveFormula =
            currentInput;

        /*
         * Convert e^( BEFORE converting ^.
         * This fixes the scientific e^x operation.
         */

        let expression =
            currentInput
                .replaceAll("×","*")
                .replaceAll("÷","/")
                .replaceAll("π","Math.PI")
                .replace(
                    /e\^\(/g,
                    "Math.exp("
                )
                .replace(
                    /\be\b/g,
                    "Math.E"
                )
                .replaceAll("^","**");

        if(
            /[^0-9+\-*/%().,\sA-Za-z_]/.test(
                expression
            )
        ){

            throw new Error(
                "Invalid expression"
            );
        }

        const calculatorFunction =
            new Function(
                "sin",
                "cos",
                "tan",
                "log",
                "ln",
                "sqrt",
                "fact",
                "Math",
                `"use strict"; return (${expression});`
            );

        const result =
            calculatorFunction(
                sin,
                cos,
                tan,
                log,
                ln,
                sqrt,
                fact,
                Math
            );

        if(
            typeof result!=="number" ||
            !Number.isFinite(result)
        ){

            throw new Error(
                "Invalid result"
            );
        }

        let finalResult=result;

        if(
            Math.abs(result%1)>0
        ){

            finalResult =
                parseFloat(
                    result.toFixed(8)
                );
        }

        finalCalculationResult =
            finalResult;

        updateDisplayValue(
            finalResult
        );

        clearOnNextInput=true;

        saveToHistory(
            lastActiveFormula,
            finalCalculationResult
        );

        display.classList.remove(
            "animate-pop"
        );

        void display.offsetWidth;

        display.classList.add(
            "animate-pop"
        );

    }catch(error){

        updateDisplayValue("Error");

        lastActiveFormula="";
        finalCalculationResult="";
        clearOnNextInput=true;

        display.classList.add(
            "animate-pop"
        );
    }
}

/* =========================================================
HISTORY
========================================================= */

function saveToHistory(
    formula,
    result
){

    if(
        historyLog.length>0 &&
        historyLog[0].formula===formula
    ) return;

    historyLog.unshift({
        formula,
        result
    });

    if(historyLog.length>100)
        historyLog.pop();

    localStorage.setItem(
        "calcHistory",
        JSON.stringify(historyLog)
    );

    renderHistory();
}

function renderHistory(){

    const list =
        document.getElementById(
            "historyList"
        );

    list.innerHTML="";

    if(historyLog.length===0){

        list.innerHTML =
            `<div class="empty-history">
                No history records yet
            </div>`;

        return;
    }

    historyLog.forEach(item=>{

        const row =
            document.createElement("div");

        row.className="history-item";

        row.onclick=()=>{
            loadHistoryItem(item.result);
        };

        const formula =
            document.createElement("div");

        formula.className =
            "history-formula";

        formula.textContent =
            item.formula+" =";

        const result =
            document.createElement("div");

        result.className =
            "history-result";

        result.textContent =
            item.result;

        row.appendChild(formula);
        row.appendChild(result);

        list.appendChild(row);
    });
}

function loadHistoryItem(value){

    updateDisplayValue(value);

    finalCalculationResult=value;
    lastActiveFormula="";
    clearOnNextInput=false;
}

function clearHistory(){

    historyLog=[];

    localStorage.removeItem(
        "calcHistory"
    );

    renderHistory();
}

/* =========================================================
VOICE REVISION
========================================================= */

function reviseCalculation(){

    window.speechSynthesis.cancel();

    let text="";

    if(lastActiveFormula!==""){

        text =
            lastActiveFormula+
            " equals "+
            finalCalculationResult;

    }else if(
        display.innerText!=="" &&
        display.innerText!=="Error" &&
        display.innerText!=="Code Set!"
    ){

        text=display.innerText;

    }else{

        text="Zero";
    }

    text =
        text
            .replaceAll("+"," plus ")
            .replaceAll("-"," minus ")
            .replaceAll("*"," multiplied by ")
            .replaceAll("/"," divided by ")
            .replaceAll("×"," multiplied by ")
            .replaceAll("÷"," divided by ")
            .replaceAll("%"," percent ")
            .replaceAll("sin("," sine of ")
            .replaceAll("cos("," cosine of ")
            .replaceAll("tan("," tangent of ")
            .replaceAll("log("," log base ten of ")
            .replaceAll("ln("," natural log of ")
            .replaceAll("sqrt("," square root of ")
            .replaceAll("fact("," factorial of ")
            .replaceAll("e^("," e to the power of ")
            .replaceAll("1/("," inverse of ")
            .replaceAll("^"," to the power of ")
            .replaceAll("("," open bracket ")
            .replaceAll(")"," close bracket ")
            .replaceAll("."," point ");

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.rate=.95;

    window.speechSynthesis.speak(
        utterance
    );
}

/* =========================================================
PRIVATE VAULT
========================================================= */

function openVault(){

    document
        .getElementById("vaultOverlay")
        .classList.add("active");

    renderGallery();
}

function closeVault(){

    document
        .getElementById("vaultOverlay")
        .classList.remove("active");

    equalClickCount=0;
}

function handleFileSelect(event){

    const files=event.target.files;

    let items =
        JSON.parse(
            localStorage.getItem(
                "vaultItems"
            )
        ) || [];

    for(const file of files){

        const reader =
            new FileReader();

        reader.onload=e=>{

            items.push({

                type:
                    file.type.startsWith("video")
                        ? "video"
                        : "image",

                data:e.target.result
            });

            localStorage.setItem(
                "vaultItems",
                JSON.stringify(items)
            );

            renderGallery();
        };

        reader.readAsDataURL(file);
    }

    event.target.value="";
}

function renderGallery(){

    const grid =
        document.getElementById(
            "galleryGrid"
        );

    grid.innerHTML="";

    let items =
        JSON.parse(
            localStorage.getItem(
                "vaultItems"
            )
        ) || [];

    items.forEach((item,index)=>{

        const container =
            document.createElement("div");

        container.className=
            "gallery-item";

        if(item.type==="video"){

            const video =
                document.createElement("video");

            video.src=item.data;
            video.controls=true;

            container.appendChild(video);

        }else{

            const img =
                document.createElement("img");

            img.src=item.data;

            container.appendChild(img);
        }

        const deleteBtn =
            document.createElement("button");

        deleteBtn.className=
            "delete-item-btn";

        deleteBtn.innerHTML="×";

        deleteBtn.onclick=()=>{

            items.splice(index,1);

            localStorage.setItem(
                "vaultItems",
                JSON.stringify(items)
            );

            renderGallery();
        };

        container.appendChild(deleteBtn);

        grid.appendChild(container);
    });
}

/* =========================================================
TOOL CATEGORY SYSTEM
========================================================= */

let currentCategory="existing";
let currentTool="distance";

function setToolCategory(category){

    currentCategory=category;

    document
        .getElementById("catExisting")
        .classList.toggle(
            "active",
            category==="existing"
        );

    document
        .getElementById("catTrader")
        .classList.toggle(
            "active",
            category==="trader"
        );

    document
        .getElementById("catP2P")
        .classList.toggle(
            "active",
            category==="p2p"
        );

    document.getElementById(
        "existingTools"
    ).style.display =
        category==="existing"
            ? "grid"
            : "none";

    document.getElementById(
        "traderTools"
    ).style.display =
        category==="trader"
            ? "grid"
            : "none";

    document.getElementById(
        "p2pTools"
    ).style.display =
        category==="p2p"
            ? "grid"
            : "none";

    if(category==="existing")
        selectTool("distance");

    if(category==="trader")
        selectTool("pnl");

    if(category==="p2p")
        selectTool("p2pbook");
}

function selectTool(type){

function setToday(id){

    const input =
        document.getElementById(id);

    if(!input) return;

    const today=new Date();

    input.value =
        `${today.getFullYear()}-${
            String(today.getMonth()+1)
            .padStart(2,"0")
        }-${
            String(today.getDate())
            .padStart(2,"0")
        }`;
}

/* =========================================================
AGE
========================================================= */

function calcAge(){

    const dob =
        document.getElementById(
            "dobInput"
        ).value;

    const target =
        document.getElementById(
            "targetDateInput"
        ).value;

    const box =
        document.getElementById(
            "toolResult"
        );

    if(!dob || !target){

        box.innerText =
            "Select both dates";

        return;
    }

    const birth=parseLocalDate(dob);
    const end=parseLocalDate(target);

    if(birth>end){

        box.innerText =
            "Date of Birth cannot be in the future";

        return;
    }

    let years =
        end.getFullYear() -
        birth.getFullYear();

    let months =
        end.getMonth() -
        birth.getMonth();

    let days =
        end.getDate() -
        birth.getDate();

    if(days<0){

        months--;

        const previousMonth =
            new Date(
                end.getFullYear(),
                end.getMonth(),
                0
            );

        days+=previousMonth.getDate();
    }

    if(months<0){

        years--;
        months+=12;
    }

    box.innerText =
        `${years} Years, ${months} Months, ${days} Days`;
}

/* =========================================================
BMI
========================================================= */

function calcBMI(){

    const w=parseFloat(
        document.getElementById(
            "bmiWeight"
        ).value
    );

    const h=parseFloat(
        document.getElementById(
            "bmiHeight"
        ).value
    );

    const box=
        document.getElementById(
            "toolResult"
        );

    if(
        !w ||
        !h ||
        w<=0 ||
        h<=0
    ){

        box.innerText=
            "Enter valid positive values";

        return;
    }

    const bmi=
        w/((h/100)*(h/100));

    let category="";

    if(bmi<18.5)
        category="Underweight";
    else if(bmi<25)
        category="Normal range";
    else if(bmi<30)
        category="Overweight";
    else
        category="Obesity range";

    box.innerText=
        `BMI: ${bmi.toFixed(2)} (${category})`;
}

function calcDiscount(){

    const price=parseFloat(
        document.getElementById(
            "discPrice"
        ).value
    );

    const discount=parseFloat(
        document.getElementById(
            "discPercent"
        ).value
    );

    const box=
        document.getElementById(
            "toolResult"
        );

    if(
        isNaN(price) ||
        isNaN(discount) ||
        price<0 ||
        discount<0
    ){

        box.innerText=
            "Enter valid numbers";

        return;
    }

    if(discount>100){

        box.innerText=
            "Discount cannot exceed 100%";

        return;
    }

    const saved=
        price*(discount/100);

    const finalPrice=
        price-saved;

    box.innerText=
        `Final Price: ${finalPrice.toFixed(2)} • Saved: ${saved.toFixed(2)}`;
}

/* =========================================================
DATE DIFFERENCE
========================================================= */

function calcDateDiff(){

    const d1=
        document.getElementById(
            "dateStart"
        ).value;

    const d2=
        document.getElementById(
            "dateEnd"
        ).value;

    const box=
        document.getElementById(
            "toolResult"
        );

    if(!d1 || !d2){

        box.innerText=
            "Select both dates";

        return;
    }

    const diff=
        Math.abs(
            parseLocalDate(d2) -
            parseLocalDate(d1)
        );

    const days=
        Math.round(
            diff/
            (1000*60*60*24)
        );

    box.innerText=
        `${days} Days • ${Math.floor(days/7)} Weeks, ${days%7} Days`;
}

function parseLocalDate(value){

    const [
        y,
        m,
        d
    ]=value.split("-").map(Number);

    return new Date(y,m-1,d);
}

/* =========================================================
UNIT ENGINE
========================================================= */

function convertUnits(type){

    const val=parseFloat(
        document.getElementById(
            "unitVal"
        ).value
    );

    const from=
        document.getElementById(
            "unitFrom"
        ).value;

    const to=
        document.getElementById(
            "unitTo"
        ).value;

    const box=
        document.getElementById(
            "toolResult"
        );

    if(isNaN(val)){

        box.innerText=
            "Enter a valid value";

        return;
    }

    let result;

    if(type==="distance"){

        const m={
            "Meters":1,
            "Kilometers":1000,
            "Centimeters":.01,
            "Miles":1609.344,
            "Feet":.3048,
            "Inches":.0254,
            "Yards":.9144
        };

        result=
            val*m[from]/m[to];
    }

    else if(type==="area"){

        const m={
            "Square Meters":1,
            "Square Kilometers":1000000,
            "Square Feet":.09290304,
            "Acres":4046.8564224,
            "Hectares":10000
        };

        result=
            val*m[from]/m[to];
    }

    else if(type==="data"){

        const m={
            "Bytes":1,
            "KB":1024,
            "MB":1024**2,
            "GB":1024**3,
            "TB":1024**4
        };

        result=
            val*m[from]/m[to];
    }

    else if(type==="mass"){

        const m={
            "Kilograms":1,
            "Grams":.001,
            "Milligrams":.000001,
            "Pounds":.45359237,
            "Ounces":.028349523125
        };

        result=
            val*m[from]/m[to];
    }

    else if(type==="speed"){

        const m={
            "m/s":1,
            "km/h":1000/3600,
            "mph":1609.344/3600,
            "Knots":1852/3600
        };

        result=
            val*m[from]/m[to];
    }

    else if(type==="temp"){

        if(from===to)
            result=val;

        else if(from==="Celsius"){

            result=
                to==="Fahrenheit"
                    ? val*9/5+32
                    : val+273.15;

        }else if(from==="Fahrenheit"){

            result=
                to==="Celsius"
                    ? (val-32)*5/9
                    : (val-32)*5/9+273.15;

        }else{

            result=
                to==="Celsius"
                    ? val-273.15
                    : (val-273.15)*9/5+32;
        }
    }

    else if(type==="time"){

        const m={
            "Seconds":1,
            "Minutes":60,
            "Hours":3600,
            "Days":86400,
            "Weeks":604800
        };

        result=
            val*m[from]/m[to];
    }

    else if(type==="volume"){

        const m={
            "Liters":1,
            "Milliliters":.001,
            "Gallons (US)":3.785411784,
            "Cubic Meters":1000
        };

        result=
            val*m[from]/m[to];
    }

    if(typeof result==="number"){

        result=
            parseFloat(
                result.toFixed(
                    type==="temp"
                        ? 4
                        : 8
                )
            );
    }

    box.innerText=
        `${val} ${from} = ${result} ${to}`;
}

function calcCryptoPnl(){

    const side=
        document.getElementById("pnlSide").value;

    const entry=
        num("pnlEntry");

    const exit=
        num("pnlExit");

    const qty=
        num("pnlQty");

    const lev=
        num("pnlLev") || 1;

    const entryFee=
        num("pnlEntryFee");

    const exitFee=
        num("pnlExitFee");

    const box=
        document.getElementById("toolResult");

    if(
        entry<=0 ||
        exit<=0 ||
        qty<=0
    ){

        box.innerText=
            "Enter valid trade values";

        return;
    }

    const entryValue=entry*qty;
    const exitValue=exit*qty;

    const gross=
        side==="long"
            ? (exit-entry)*qty
            : (entry-exit)*qty;

    const fees=
        entryValue*(entryFee/100)+
        exitValue*(exitFee/100);

    const net=gross-fees;

    const margin=
        entryValue/lev;

    const roi=
        margin>0
            ? net/margin*100
            : 0;

    box.innerHTML=
        `
        ${formatResult(
            "Gross P&L",
            money(gross),
            gross
        )}<br>
        Fees: ${money(fees)}<br>
        Net P&L: <b>${money(net)}</b><br>
        Notional: ${money(entryValue)} → ${money(exitValue)}<br>
        Margin: ${money(margin)}<br>
        ROI: ${roi.toFixed(2)}%
        `;
}

function calcFutures(){

    const side=
        document.getElementById("fSide").value;

    const entry=num("fEntry");
    const exit=num("fExit");
    const qty=num("fQty");
    const lev=num("fLev");
    const mm=num("fMM");
    const fee=num("fFee");

    const box=
        document.getElementById("toolResult");

    if(
        entry<=0 ||
        exit<=0 ||
        qty<=0 ||
        lev<=0
    ){

        box.innerText=
            "Enter valid values";

        return;
    }

    const gross=
        side==="long"
            ? (exit-entry)*qty
            : (entry-exit)*qty;

    const notional=entry*qty;
    const fees=
        notional*(fee/100);

    const net=gross-fees;
    const margin=notional/lev;

    let liq;

    if(side==="long"){

        liq=
            entry*
            (
                1-
                1/lev+
                mm/100
            );

    }else{

        liq=
            entry*
            (
                1+
                1/lev-
                mm/100
            );
    }

    box.innerHTML=
        `
        Gross P&L: <b>${money(gross)}</b><br>
        Fees: ${money(fees)}<br>
        Net P&L: <b>${money(net)}</b><br>
        Margin: ${money(margin)}<br>
        Est. Liquidation: ${money(liq)}
        `;
}

        class="tool-result-box"
        id="toolResult">
        Enter account and trade risk
    </div>`;

}

function calcRisk(){

    const balance=num("riskBalance");
    const riskPct=num("riskPercent");
    const entry=num("riskEntry");
    const sl=num("riskSL");
    const lev=num("riskLev")||1;

    const box=
        document.getElementById("toolResult");

    if(
        balance<=0 ||
        riskPct<=0 ||
        entry<=0 ||
        sl<=0
    ){

        box.innerText=
            "Enter valid values";

        return;
    }

    const riskAmount=
        balance*riskPct/100;

    const distance=
        Math.abs(entry-sl);

    if(distance===0){

        box.innerText=
            "Entry and Stop Loss cannot be equal";

        return;
    }

    const quantity=
        riskAmount/distance;

    const notional=
        quantity*entry;

    const margin=
        notional/lev;

    box.innerHTML=
        `
        Risk Amount: ${money(riskAmount)}<br>
        Stop Distance: ${distance.toFixed(8)}<br>
        Position Size: <b>${quantity.toFixed(8)}</b><br>
        Notional: ${money(notional)}<br>
        Approx. Margin @ ${lev}×: ${money(margin)}
        `;
}

    </button>

    </div>`;

function calcRR(){

    const side=
        document.getElementById("rrSide").value;

    const entry=num("rrEntry");
    const sl=num("rrSL");
    const tp=num("rrTP");
    const qty=num("rrQty");

    const box=
        document.getElementById("toolResult");

    if(
        entry<=0 ||
        sl<=0 ||
        tp<=0
    ){

        box.innerText=
            "Enter valid prices";

        return;
    }

    let risk;
    let reward;

    if(side==="long"){

        risk=entry-sl;
        reward=tp-entry;

    }else{

        risk=sl-entry;
        reward=entry-tp;
    }

    if(risk<=0 || reward<=0){

        box.innerText=
            "Check SL/TP for selected direction";

        return;
    }

    const ratio=
        reward/risk;

    let html=
        `
        Risk / Unit: ${money(risk)}<br>
        Reward / Unit: ${money(reward)}<br>
        R:R = <b>1 : ${ratio.toFixed(2)}</b>
        `;

    if(qty>0){

        html+=
            `<br>Potential Risk: ${money(risk*qty)}
             <br>Potential Reward: ${money(reward*qty)}`;
    }

    box.innerHTML=html;
}

function saveJournalTrade(){

    const asset=
        document.getElementById(
            "journalAsset"
        ).value;

    const side=
        document.getElementById(
            "journalSide"
        ).value;

    const entry=num("journalEntry");
    const exit=num("journalExit");
    const qty=num("journalQty");

    const note=
        document.getElementById(
            "journalNote"
        ).value;

    if(
        entry<=0 ||
        exit<=0 ||
        qty<=0
    ){

        alert("Enter valid trade details");
        return;
    }

    const pnl=
        side==="Long"
            ? (exit-entry)*qty
            : (entry-exit)*qty;

    let journal=
        JSON.parse(
            localStorage.getItem(
                "tradeJournal"
            )
        ) || [];

    journal.unshift({

        date:new Date().toLocaleString(),

        asset,
        side,
        entry,
        exit,
        qty,
        pnl,
        note
    });

    localStorage.setItem(
        "tradeJournal",
        JSON.stringify(journal)
    );

    renderJournalList();
}

function renderJournalList(){

    const list=
        document.getElementById(
            "journalList"
        );

    if(!list) return;

    let journal=
        JSON.parse(
            localStorage.getItem(
                "tradeJournal"
            )
        ) || [];

    if(journal.length===0){

        list.innerHTML=
            `<div class="empty-history">
                No trades recorded
            </div>`;

        return;
    }

    list.innerHTML=
        journal.map(
            (t,i)=>`

            <div class="journal-item">

                <div class="journal-top">

                    <b>
                        ${t.asset} • ${t.side}
                    </b>

                    <span class="${
                        t.pnl>=0
                            ? "journal-profit"

                    }">

        )];

    const buyRate=
        [...document.querySelectorAll(
            ".p2pBuyRate"
        )];

    const sellQty=
        [...document.querySelectorAll(
            ".p2pSellQty"
        )];

    const sellRate=
        [...document.querySelectorAll(
            ".p2pSellRate"
        )];

    const buys=[];
    const sells=[];

    for(
        let i=0;
        i<buyQty.length;
        i++
    ){

        const qty=parseFloat(
            buyQty[i].value
        );

        const rate=parseFloat(
            buyRate[i].value
        );

        if(
            qty>0 &&
            rate>0
        ){

            buys.push({
                qty,
                rate
            });
        }
    }

    for(
        let i=0;
        i<sellQty.length;
        i++
    ){

        const qty=parseFloat(
            sellQty[i].value
        );

        const rate=parseFloat(
            sellRate[i].value
        );

        if(
            qty>0 &&
            rate>0
        ){

            sells.push({
                qty,
                rate
            });
        }
    }

    return {
        buys,
        sells
    };
}

function calculateP2PBook(){

    const data=collectP2P();

    const buyFee=
        num("p2pBuyFee");

    const sellFee=
        num("p2pSellFee");

    let bought=0;
    let spent=0;

    data.buys.forEach(x=>{

        bought+=x.qty;
        spent+=x.qty*x.rate;

    });

    let sold=0;
    let revenue=0;

    data.sells.forEach(x=>{

        sold+=x.qty;
        revenue+=x.qty*x.rate;

    });

    if(bought<=0){

        document.getElementById(
            "p2pSummary"
        ).innerHTML=
            `<div class="summary-item">
                <span class="summary-label">
                    Status
                </span>
                <span class="summary-value red">
                    Add at least one USDT buy
                </span>
            </div>`;

        return;
    }

    const avgBuy=
        spent/bought;

    const avgSell=
        sold>0
            ? revenue/sold
            : 0;

    const buyFees=
        spent*buyFee/100;

    const sellFees=
        revenue*sellFee/100;

    /*
     * Realized P2P profit is based on the
     * average cost of the USDT sold.
     */

    const costOfSold=
        sold*avgBuy;

    const grossProfit=
        revenue-costOfSold;

    const totalFees=
        buyFees+sellFees;

    const netProfit=
        grossProfit-totalFees;

    const remaining=
        bought-sold;

    const roi=
        costOfSold>0
            ? netProfit/costOfSold*100
            : 0;

    const box=
        document.getElementById(
            "p2pSummary"
        );

    box.innerHTML=`

        <div class="summary-item">
            <span class="summary-label">
                TOTAL BOUGHT
            </span>
            <span class="summary-value green">
                ${bought.toFixed(6)} USDT
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                TOTAL SPENT
            </span>
            <span class="summary-value">
                ${money(spent)}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                AVERAGE BUY RATE
            </span>
            <span class="summary-value green">
                ₹${avgBuy.toFixed(4)}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                TOTAL SOLD
            </span>
            <span class="summary-value blue">
                ${sold.toFixed(6)} USDT
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                TOTAL REVENUE
            </span>
            <span class="summary-value">
                ${money(revenue)}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                AVERAGE SELL RATE
            </span>
            <span class="summary-value blue">
                ${sold>0
                    ? "₹"+avgSell.toFixed(4)
                    : "—"}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                REMAINING USDT
            </span>
            <span class="summary-value yellow">
                ${remaining.toFixed(6)} USDT
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                GROSS PROFIT
            </span>
            <span class="summary-value ${
                grossProfit>=0
                    ? "green"
                    : "red"
            }">
                ${money(grossProfit)}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                TOTAL FEES
            </span>
            <span class="summary-value">
                ${money(totalFees)}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                NET PROFIT
            </span>
            <span class="summary-value ${
                netProfit>=0
                    ? "green"
                    : "red"
            }">
                ${money(netProfit)}
            </span>
        </div>

        <div class="summary-item">
            <span class="summary-label">
                ROI ON SOLD INVENTORY
            </span>
            <span class="summary-value ${
                roi>=0
                    ? "green"
                    : "red"
            }">
                ${roi.toFixed(2)}%
            </span>
        </div>
    `;
}

function saveP2PBook(){

    p2pData=collectP2P();

    saveP2P();

    alert("P2P book saved on this device.");
}

function resetP2PBook(){

    p2pData={
        buys:[],
        sells:[]
    };

    saveP2P();

    renderP2PBook();
}

function calcP2PCalc(){

    const fee=num("p2pCalcFee");

    ){

}

/* =========================================================
HELPER FUNCTIONS
========================================================= */

function num(id){

    const el=
        document.getElementById(id);

    if(!el)
        return 0;

    const value=
        parseFloat(el.value);

    return Number.isFinite(value)
        ? value
        : 0;
}

function money(value){

    const sign=
        value<0 ? "-" : "";

    return (
        sign+
        "₹"+
        Math.abs(value)
            .toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            )
    );
}

function formatResult(
    label,
    value,
    numeric
){

    return `
        ${label}:
        <b class="${
            numeric>=0
                ? "result-positive"
                : "result-negative"
        }">
            ${value}
        </b>
    `;
}

/* =========================================================
KEYBOARD SUPPORT
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const key=event.key;

        if(/^[0-9.]$/.test(key)){

            appendNumber(key);
            return;
        }

        if(
            ["+","-","*","/","%"]
            .includes(key)
        ){

            appendOperator(key);
            return;
        }

        if(
            key==="Enter" ||
            key==="="
        ){

            event.preventDefault();
            calculate();
            return;
        }

        if(key==="Backspace"){

            deleteLast();
            return;
        }

        if(key==="Escape"){

            clearDisplay();
            return;
        }
    }
);
